<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Interactive accessibility demo</title>
<style>body{font:18px system-ui;padding:25px}button,a,input,select,summary{margin:8px}button{min-height:32px}dialog{padding:30px} [hidden]{display:none!important}</style>
</head><body><h1>Interactive accessibility demo</h1><main id="app"></main>
<script>
const app=document.getElementById('app');
const back='<button type="button" onclick="home()">View home</button>';
sessionStorage.setItem('fixture-session', 'private-session-fixture');
function home(){
 app.innerHTML=`<nav aria-label="Features">
 <button type="button" aria-haspopup="menu" aria-expanded="false" id="menu"
 onclick="this.setAttribute('aria-expanded','true');document.getElementById('items').hidden=false;localStorage.setItem('changed','yes')">Open menu</button>
 <div role="menu" id="items" hidden><button role="menuitem" onclick="orders()">Orders</button></div>
 <a href="#tabs" onclick="event.preventDefault();tabs(false)">Tabs</a>
 <a href="#accordion" onclick="event.preventDefault();accordion()">Accordion</a>
 <a href="#dropdown" onclick="event.preventDefault();dropdown()">Dropdowns</a>
 <a href="#form" onclick="event.preventDefault();form()">Form</a>
 <button type="button" aria-haspopup="dialog" onclick="document.getElementById('modal').showModal()">Open dialog</button>
 <button type="button" onclick="fetch('/unsafe',{method:'POST'})">Mystery action</button>
 <button type="button" onclick="fetch('/unsafe',{method:'POST'})">Show unsafe</button>
 <button type="button" onclick="location.href='/broken'">Show broken</button>
 <button type="button" onclick="location.href='/delete'">Delete account</button>
 <a href="https://example.org/">External</a></nav>
 <dialog id="modal"><h2>Unnamed modal</h2><input><button type="button" onclick="this.closest('dialog').close()">Close dialog</button></dialog>`;
}
function orders(){app.innerHTML=back+'<h2>Orders</h2><img src="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\'/%3E"><button></button>'}
function tabs(history){
 app.innerHTML=back+`<div role="tablist" aria-label="Orders">
 <button role="tab" aria-selected="${!history}" onclick="tabs(false)">Current</button>
 <button role="tab" aria-selected="${history}" onclick="tabs(true)">History</button></div>
 <div role="tabpanel"><h2>${history?'History':'Current'} orders</h2>${history?'<button></button>':'No current orders'}</div>`;
}
function accordion(){app.innerHTML=back+'<h2>Accordion</h2><details><summary>Advanced fields</summary><label>Name <input></label><button type="button" onclick="this.insertAdjacentHTML(\'afterend\',\'<img src=x>\');this.disabled=true">Show extra field</button></details>'}
function dropdown(){app.innerHTML=back+`<h2>Dropdowns</h2><label>Region <select id="region" onchange="document.getElementById('region-note').textContent=this.selectedIndex?'West region':'East region'">
 <option value="east">East</option><option value="west">West</option></select></label><p id="region-note">East region</p>
 <button role="combobox" aria-expanded="false" id="combo" aria-controls="options" onclick="this.setAttribute('aria-expanded','true');document.getElementById('options').hidden=false">Color</button>
 <div id="options" role="listbox" aria-label="Color" hidden><button role="option" onclick="choose('Blue')">Blue</button><button role="option" onclick="choose('Green')">Green</button></div>`}
function choose(value){document.getElementById('combo').textContent=value;document.getElementById('combo').setAttribute('aria-expanded','false');document.getElementById('options').hidden=true}
function form(){app.innerHTML=back+`<h2>Form</h2><form action="/unsafe" method="post"><label>Query <input id="query" oninput="document.getElementById('echo').textContent=this.value"></label><p id="echo"></p><button type="submit">Submit</button></form>`}
home();
</script></body></html>
