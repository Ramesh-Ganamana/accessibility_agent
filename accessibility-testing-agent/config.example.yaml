application:
  url: https://example.com
authentication:
  allowed_origins: [] # Additional trusted SSO origins; standard OAuth redirects are detected.
  username_selector: ""
  password_selector: ""
  submit_selector: ""
  success_selector: ""
browser:
  browser: chromium
  headless: true
  viewport: {width: 1920, height: 1080}
crawl:
  mode: interactive
  max_depth: 20
  max_states: 500
  timeout: 30000
  max_duration_seconds: 3600
  max_actions_per_state: 100
  settle_ms: 200
  stability_timeout_ms: 60000
  dom_quiet_ms: 1000
  network_idle_ms: 500
  ready_selector: "" # Optional visible selector that signals application readiness.
  loading_selectors: [] # Additional visible loaders that must disappear.
  max_actions: 2000
  max_replay_steps: 40
  max_select_options: 10
  ignore_selectors: []
  form_values: {}
  allowed_request_urls: []
  same_origin_only: true
accessibility:
  standard: WCAG
  version: "2.2"
  level: AA
keyboard: {enabled: true}
visual: {enabled: true}
ai: {enabled: false}
output_dir: reports
