[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "accessibility-testing-agent"
version = "0.1.0"
description = "Interactive state-based accessibility scanner with Chromium and axe-core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0,<7", "playwright>=1.51,<2", "Jinja2>=3.1.6,<4"]

[project.optional-dependencies]
browser = ["playwright>=1.51,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6,<7"]

[project.scripts]
accessibility-agent = "accessibility_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
accessibility_agent = ["py.typed", "accessibility/vendor/*", "reporting/templates/*.html", "crawler/*.js", "conformance/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
